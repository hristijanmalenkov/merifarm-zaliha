<style>
/* Layout: sticky top bar with search, one scrolling column, article page as a stacked card set */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1b1f1c; --muted:#66706a; --line:#dde2de;
  --accent:#166a5a; --accent-soft:#e2f0ec; --y1:#166a5a; --y2:#7fb3a6; --y3:#c9ddd6;
  --good:#2e7d32; --warn:#b26a00; --bad:#b3261e; --bad-soft:#fbe9e7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1b1f1d; --fg:#e8ebe8; --muted:#98a39c; --line:#2b312d;
  --accent:#4fc3a9; --accent-soft:#17302a; --y1:#4fc3a9; --y2:#2f7a68; --y3:#214a40;
  --good:#66bb6a; --warn:#ffb74d; --bad:#ef5350; --bad-soft:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1b1f1d; --fg:#e8ebe8; --muted:#98a39c; --line:#2b312d;
  --accent:#4fc3a9; --accent-soft:#17302a; --y1:#4fc3a9; --y2:#2f7a68; --y3:#214a40;
  --good:#66bb6a; --warn:#ffb74d; --bad:#ef5350; --bad-soft:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:960px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand small{color:var(--muted);font-weight:400;margin-left:6px}
nav{display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:500}
nav a.on{background:var(--accent-soft);color:var(--accent)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
#q{flex:1 1 220px;min-width:0}
main{max-width:960px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font:500 22px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.tile .v small{font:400 12px var(--sans);color:var(--muted);margin-left:4px}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.good .v{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.twrap{overflow-x:auto}
a.art{color:var(--fg);text-decoration:none;font-weight:500}
a.art:hover{color:var(--accent)}
.code{font-family:var(--mono);color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500;margin:2px 4px 2px 0}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip .g{opacity:.65;font-weight:400}
.chip button{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0 0 0 2px;line-height:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.row{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{font-weight:500;color:var(--muted)}
.kv span{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto;max-width:100%}
.ax{fill:var(--muted);font:11px var(--mono)}
.bar{fill:var(--accent)} .b1{fill:var(--y1)} .b2{fill:var(--y2)} .b3{fill:var(--y3)}
.grid{stroke:var(--line);stroke-width:1}
.line{fill:none;stroke:var(--accent);stroke-width:1.5}
.area{fill:var(--accent);opacity:.12}
.empty{color:var(--muted);padding:24px;text-align:center}
.err{background:var(--bad-soft);color:var(--bad);padding:12px 14px;border-radius:10px}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.cover div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.cover .l{font-size:11px;color:var(--muted)} .cover .v{font:500 16px var(--mono)}
.cover .ok{border-color:var(--good)} .cover .low{border-color:var(--bad);background:var(--bad-soft)}
.back{color:var(--muted);text-decoration:none;font-size:13px}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font:500 14px var(--sans);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input,.inline select{flex:1 1 140px;min-width:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.up{color:var(--good)} .down{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.c-orange td:first-child{box-shadow:inset 4px 0 0 #e8842a}.c-orange{background:rgba(232,132,42,.10)}
.c-red td:first-child{box-shadow:inset 4px 0 0 var(--bad)}.c-red{background:rgba(179,38,30,.10)}
.c-yellow td:first-child{box-shadow:inset 4px 0 0 #d4b106}.c-yellow{background:rgba(212,177,6,.12)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}.sw.c-orange{background:#e8842a}.sw.c-red{background:var(--bad)}.sw.c-yellow{background:#d4b106}
.saved td{transition:background .3s;background:var(--accent-soft)!important}
#nrtable table{font-size:12.5px;table-layout:fixed;width:100%}
#nrtable th,#nrtable td{padding:4px 5px}
#nrtable td.n{font-size:12px}
#nrtable .art{font-size:13px}
#nrtable .code{font-size:11px}
#nrtable .chip{font-size:10.5px;padding:0 6px;margin:1px 3px 0 0}
#nrtable input{padding:5px 6px;font-size:13px;border-radius:7px}
#nrtable .tl{display:block;line-height:1.2;white-space:nowrap}
#nrtable .tl small{color:var(--muted);font-size:10px;margin-right:2px}
.ci{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);border-left:5px solid transparent;cursor:pointer}
.ci.cur{background:var(--accent-soft)}
.bigq{font:600 26px/1 var(--mono);min-width:72px;text-align:right;color:var(--accent);margin-right:10px}
.ci.ima{border-left-color:var(--good);background:rgba(46,125,50,.10)}
.ci.nema{border-left-color:var(--bad);background:rgba(179,38,30,.10)}
.ci button{appearance:none;border:1px solid var(--line);background:var(--surface);width:44px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.ci button.ok{color:var(--good)} .ci button.no{color:var(--bad)}
.ci.ima button.ok{background:var(--good);color:#fff} .ci.nema button.no{background:var(--bad);color:#fff}
.minibox{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;padding:6px 0}
.minibox table{font-size:12px}
.plus{display:inline-block;width:18px;height:18px;line-height:17px;text-align:center;border:1px solid var(--line);border-radius:5px;color:var(--accent);text-decoration:none;font-weight:600;margin-left:6px;font-size:13px}
.plus:hover{background:var(--accent-soft)}
.minirow td{background:var(--bg)}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 14px var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
textarea{width:100%;min-height:72px;resize:vertical}
.note{white-space:pre-wrap;font-size:14px}
.bulk{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.tile,.card{transition:border-color .15s}}
tr.rh td,.rh{background:rgba(124,58,237,.10)} tr.rh td:first-child{box-shadow:inset 4px 0 0 #7c3aed} .chip.rh{background:rgba(124,58,237,.15);color:#7c3aed}
.rsh{color:var(--bad);font-weight:600;font-size:.9em}
#login{max-width:380px;margin:60px auto;padding:0 16px}
body.auth header,body.auth main{display:none}
</style>

<body>
<header><div class="hwrap">
  <div class="brand">Merifarm<small>залиха</small></div>
  <input id="q" type="search" placeholder="Пребарај артикл по име или шифра…" autocomplete="off">
  <nav><a href="#pregled" id="n-pregled">Преглед</a><a href="#artikli" id="n-artikli">Артикли</a><a href="#vlezovi" id="n-vlezovi">Влезови</a><a href="#naracki" id="n-naracki">Нарачки</a><a href="#rokovi" id="n-rokovi">Рокови</a><a href="#brendovi" id="n-brendovi">Брендови</a><a href="#tagovi" id="n-tagovi">Тагови</a><a href="#rashod" id="n-rashod">Расход</a></nav><a class="hint" id="who" href="#najavi" style="margin-left:auto;text-decoration:none" title="Последни најави"></a><button class="btn sec" id="logout" style="padding:6px 10px">Одјава</button>

<div id="login" hidden><form id="lform" class="card"><h1>Merifarm Залиха</h1><p class="sub">Најави се за да продолжиш</p>

  <div class="inline"><button class="btn" type="submit">Најави се</button><button class="btn sec" type="button" id="lreg">Прв пат? Направи налог</button></div><p id="lmsg" class="hint" style="margin:10px 0 0"></p></form></div>
<main id="main"><div class="empty">Се поврзувам со базата…</div></main>

<script>
const SB_URL='https://giqjayevgbmjltzmqodu.supabase.co';
const SB_KEY='sb_publishable_7RIi-7YALZv1rQJZan-UHw_cGgA0KuX';
let mcp=null; const main=document.getElementById('main'); const q=document.getElementById('q');
const fmt=n=>n==null?'—':Number(n).toLocaleString('mk-MK',{maximumFractionDigits:0});
const fmt1=n=>n==null?'—':Number(n).toLocaleString('mk-MK',{maximumFractionDigits:1});
const fmt2=n=>n==null?'—':Number(n).toLocaleString('mk-MK',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct2=(a,b)=>{ if(!b) return '—'; const p=(a-b)/b*100; return `<span class="${p>=0?'up':'down'}">${p>=0?'+':''}${fmt1(p)}%</span>`; };
const pct=(a,b)=>{ if(!b) return '—'; const p=(a-b)/b*100; return `<span class="${p>=0?'up':'down'}">${p>=0?'+':''}${fmt(p)}%</span>`; };
const esc=s=>s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sq=s=>String(s).replace(/'/g,"''");
const MES=['јан','фев','мар','апр','мај','јун','јул','авг','сеп','окт','ное','дек'];
const MESL=['јануари','февруари','март','април','мај','јуни','јули','август','септември','октомври','ноември','декември'];

async function sql(query){
  const {data,error}=await sb.rpc('app_sql',{q:query});
  if(error) throw new Error(error.message||JSON.stringify(error));
  return Array.isArray(data)?data:[];
}
function fail(e){ main.innerHTML=`<div class="err">Грешка (${esc(e.code||'')}): ${esc(e.message||e)}</div>`; }
function toast(el,msg,bad){ el.innerHTML=`<span class="${bad?'down':'up'}">${esc(msg)}</span>`; setTimeout(()=>{el.textContent=''},2500); }

/* ---------- charts ---------- */
function barChart(items, labelOf, valueOf, h=160){
  const W=640, pad={l:36,r:8,t:10,b:26}; const n=items.length; if(!n) return '<div class="empty">Нема податоци</div>';
  const max=Math.max(1,...items.map(valueOf)); const iw=(W-pad.l-pad.r)/n; const bw=Math.max(2,iw*0.7);
  const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  [0,.5,1].forEach(f=>{const yy=y(max*f); s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pad.l-4}" y="${yy+4}" text-anchor="end">${fmt(max*f)}</text>`;});
  items.forEach((it,i)=>{const v=valueOf(it); const x=pad.l+i*iw+(iw-bw)/2; s+=`<rect class="bar" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="2"><title>${esc(labelOf(it))}: ${fmt1(v)}</title></rect>`;
    const every=Math.ceil(n/12); if(i%every===0) s+=`<text class="ax" x="${x+bw/2}" y="${h-8}" text-anchor="middle">${esc(labelOf(it))}</text>`;});
  return s+'</svg>';
}
function groupChart(groups, series, h=170){ // groups: 12 labels; series: [{cls, vals[12]}]
  const W=640, pad={l:36,r:8,t:10,b:26}; const n=groups.length;
  const max=Math.max(1,...series.flatMap(s=>s.vals)); const gw=(W-pad.l-pad.r)/n; const bw=Math.max(2,(gw*0.78)/series.length);
  const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  [0,.5,1].forEach(f=>{const yy=y(max*f); s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pad.l-4}" y="${yy+4}" text-anchor="end">${fmt(max*f)}</text>`;});
  groups.forEach((g,i)=>{ series.forEach((sr,k)=>{ const v=sr.vals[i]||0; const x=pad.l+i*gw+gw*0.11+k*bw; s+=`<rect class="${sr.cls}" x="${x}" y="${y(v)}" width="${bw-1}" height="${Math.max(0,y(0)-y(v))}" rx="1.5"><title>${esc(g)} ${sr.name}: ${fmt1(v)}</title></rect>`; });
    s+=`<text class="ax" x="${pad.l+i*gw+gw/2}" y="${h-8}" text-anchor="middle">${esc(g)}</text>`; });
  return s+'</svg>';
}
function lineChart(items, labelOf, valueOf, h=150){
  const W=640, pad={l:36,r:8,t:10,b:26}; const n=items.length; if(n<2) return '<div class="empty">Нема податоци</div>';
  const max=Math.max(1,...items.map(valueOf)); const x=i=>pad.l+(W-pad.l-pad.r)*i/(n-1); const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  const pts=items.map((it,i)=>`${x(i)},${y(valueOf(it))}`).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  [0,.5,1].forEach(f=>{const yy=y(max*f); s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pad.l-4}" y="${yy+4}" text-anchor="end">${fmt(max*f)}</text>`;});
  s+=`<polygon class="area" points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}"/><polyline class="line" points="${pts}"/>`;
  const every=Math.ceil(n/8); items.forEach((it,i)=>{ if(i%every===0||i===n-1) s+=`<text class="ax" x="${x(i)}" y="${h-8}" text-anchor="middle">${esc(labelOf(it))}</text>`; });
  const last=items[n-1]; s+=`<circle cx="${x(n-1)}" cy="${y(valueOf(last))}" r="3" class="bar"/>`;
  return s+'</svg>';
}
const rsh=(v,r)=>(v==null?'·':fmt1(v))+(r?` <span class="rsh" title="расход (не е продажба)">(${fmt1(r)})</span>`:'');
function yoyTable(rows){ // rows: {y,m,kol,rashod?}
  const years=[...new Set(rows.map(r=>+r.y))].sort(); const by={}, rb={}; rows.forEach(r=>{by[r.y+'-'+r.m]=+r.kol; if(+r.rashod) rb[r.y+'-'+r.m]=+r.rashod;});
  const tot={}; years.forEach(y=>tot[y]=0);
  let h=`<table><tr><th>Месец</th>${years.map(y=>`<th class="n">${y}</th>`).join('')}<th class="n">${years.at(-1)} vs ${years.at(-2)??''}</th></tr>`;
  for(let m=1;m<=12;m++){
    const v=years.map(y=>by[y+'-'+m]); years.forEach((y,i)=>tot[y]+=v[i]||0);
    const a=v.at(-1), b=v.at(-2);
    h+=`<tr><td>${MES[m-1]}</td>${v.map((x,i)=>`<td class="n">${rsh(x,rb[years[i]+'-'+m])}</td>`).join('')}<td class="n">${a!=null&&b!=null?pct(a,b):'—'}</td></tr>`;
  }
  h+=`<tr><td><b>Вкупно</b></td>${years.map(y=>`<td class="n"><b>${fmt(tot[y])}</b></td>`).join('')}<td></td></tr></table>`;
  const series=years.slice(-3).map((y,i,arr)=>({name:String(y),cls:'b'+(arr.length-i),vals:Array.from({length:12},(_,m)=>by[y+'-'+(m+1)]||0)}));
  const legend=`<div class="legend">${series.map(s=>`<span><i class="${s.cls}" style="background:var(--${s.cls==='b1'?'y1':s.cls==='b2'?'y2':'y3'})"></i>${s.name}</span>`).join('')}</div>`;
  return {table:h, chart:groupChart(MES,series)+legend};
}

/* ---------- tags helpers ---------- */
let TAGS=null;
async function loadTags(force){ if(TAGS&&!force) return TAGS; TAGS=await sql(`select t.id,t.ime,g.id gid,g.ime grupa from tags t join tag_groups g on g.id=t.group_id order by g.redosled,g.ime,t.ime`); return TAGS; }
function tagPicker(id){
  const groups=[...new Map(TAGS.map(t=>[t.gid,t.grupa])).entries()];
  return `<div class="inline" id="${id}">
    <select class="tg"><option value="">— група —</option>${groups.map(([gid,g])=>`<option value="${gid}">${esc(g)}</option>`).join('')}<option value="__new">+ нова група…</option></select>
    <input class="tgnew" placeholder="Име на нова група" hidden>
    <input class="tn" list="dl-${id}" placeholder="Таг (постоечки или нов)"><datalist id="dl-${id}"></datalist>
    <button class="btn add">Додај</button><span class="msg"></span></div>`;
}
function wirePicker(el, onAdd){
  const sel=el.querySelector('.tg'), nw=el.querySelector('.tgnew'), tn=el.querySelector('.tn'), dl=el.querySelector('datalist');
  const fill=()=>{ const gid=sel.value; dl.innerHTML=TAGS.filter(t=>!gid||gid==='__new'||String(t.gid)===gid).map(t=>`<option value="${esc(t.ime)}">${esc(t.grupa)}</option>`).join(''); };
  sel.onchange=()=>{ nw.hidden=sel.value!=='__new'; fill(); }; fill();
  const go=async()=>{ const name=tn.value.trim(); if(!name) return; let gid=sel.value; let gname=null;

function yearChart(years, target){ // years: [{y,v,ytd:boolean}], target: {y,v} or null
  const W=640,h=220,pad={l:60,r:16,t:16,b:30}; const n=years.length;
  const max=Math.max(1,...years.map(x=>x.v), target?target.v:0)*1.08;
  const gw=(W-pad.l-pad.r)/n, bw=gw*0.52; const y=v=>pad.t+(h-pad.t-pad.b)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img">`;
  [0,.25,.5,.75,1].forEach(f=>{const yy=y(max*f/1.08); s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text class="ax" x="${pad.l-6}" y="${yy+4}" text-anchor="end">${fmt(max*f/1.08/1e6)} M</text>`;});
  years.forEach((x,i)=>{ const cx=pad.l+i*gw+gw/2; const x0=cx-bw/2;
    s+=`<rect class="${x.ytd?'b1':'b2'}" x="${x0}" y="${y(x.v)}" width="${bw}" height="${Math.max(0,y(0)-y(x.v))}" rx="3"><title>${x.y}: ${fmt(x.v)}</title></rect>`;
    s+=`<text class="ax" x="${cx}" y="${y(x.v)-6}" text-anchor="middle" style="font-weight:500">${fmt(x.v/1e6)} M</text>`;
    s+=`<text class="ax" x="${cx}" y="${h-10}" text-anchor="middle">${x.y}${x.ytd?' (до сега)':''}</text>`;
    if(target&&target.y===x.y){ const ty=y(target.v); s+=`<line x1="${x0-10}" x2="${x0+bw+10}" y1="${ty}" y2="${ty}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 3"/><text class="ax" x="${x0+bw+12}" y="${ty+4}" style="fill:var(--warn);font-weight:500">таргет ${fmt(target.v/1e6)} M</text>`; }
  });
  return s+'</svg>';
}

const MINI={};
function sparkline(vals,h=56){ const W=640,n=vals.length; if(n<2) return ''; const max=Math.max(1,...vals); const x=i=>8+(W-16)*i/(n-1), y=v=>6+(h-14)*(1-v/max);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '); return `<svg viewBox="0 0 ${W} ${h}" style="height:${h}px"><polygon class="area" points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}"/><polyline class="line" points="${pts}"/></svg>`; }
function kartonHtml(sf,d){
  const years=[...new Set(d.mon.map(r=>+r.y))].sort(); const by={}, rb={}; d.mon.forEach(r=>{by[r.y+'-'+r.m]=+r.kol; if(+r.rashod) rb[r.y+'-'+r.m]=+r.rashod;});

    return `<tr><td style="color:${colors[years.length-1-i]||'var(--muted)'};font-weight:600">${y}</td>${Array.from({length:12},(_,m)=>{const v=by[y+'-'+(m+1)]; return `<td class="n">${rsh(v,rb[y+'-'+(m+1)])}</td>`;}).join('')}<td class="n"><b>${fmt(tot)}</b></td></tr>`; }).join('');
  const seq=[]; years.forEach(y=>{ for(let m=1;m<=12;m++){ if(y===curY && m>+d.last.slice(5,7)) break; seq.push(by[y+'-'+m]||0);} });
  const rate=(+d.prod_90)/90; const traeDo=rate>0&&+d.zaliha>0?new Date(new Date(d.last).getTime()+(+d.zaliha/rate)*86400000).toLocaleDateString('mk-MK'):'—';

      <div class="tile"><div class="l">Вредност на залиха</div><div class="v" style="font-size:16px">${fmt(+d.zaliha*(+d.cena||0))}<small>ден</small></div></div></div>
    ${d.predlog!=null?`<div class="card" style="margin:8px 0;padding:10px 12px;font-size:13px"><b>Предлог за нарачка до ${d.do_datum.split('-').reverse().join('.')} (${d.dena} д.): ${fmt(d.predlog)} парч.</b>
      <div class="hint" style="margin-top:4px">Дневно (90 д.${d.spike?', без еднократниот излез':''}): <b>${fmt1(+d.mrate)}</b> × сезонски фактор <b>${fmt1(+d.f*100)/100}</b>${d.own_f!=null&&+d.w>=0.2?` (глобален ${fmt1(+d.g_f*100)/100}, сопствен ${fmt1(+d.own_f*100)/100}, тежина ${fmt(+d.w*100)}%)`:` (глобален)`} × ${d.dena} д. = <b>${fmt1(d.demand)}</b> · + сигурносна залиха <b>${fmt1(d.safety)}</b> · − залиха <b>${fmt1(Math.max(0,+d.zaliha))}</b></div>
      <div class="hint" style="margin-top:4px">Тренд 30 д. vs претходни 60: <b>${d.trend30==null?'·':(d.trend30>=0?'+':'')+fmt(+d.trend30*100)+'%'}</b> (${fmt1(d.s30)} vs ${fmt1(+d.s_prev60/2)} на 30 д.) · Лани ист период: 90 д. <b>${d.yoy==null?'·':(d.yoy>=0?'+':'')+fmt(+d.yoy*100)+'%'}</b> (${fmt1(d.s90)} vs ${fmt1(d.lani90)}) · лани во целниот период: <b>${fmt1(d.lani_t)}</b> парч.</div></div>`:''}

}
function wireMini(root){

    if(!MINI[s]){ const [mon,[st]]=await Promise.all([sql(`select s.y,s.m,s.kol,r.kol rashod from (select extract(year from datum)::int y, extract(month from datum)::int m, sum(kolicina) kol from sales_daily where sifra='${s}' group by 1,2) s left join rashod_monthly r on r.sifra='${s}' and r.y=s.y and r.m=s.m order by 1,2`),
        sql(`select st.zaliha,st.prod_90,st.posledna_prodazba posl,st.prv_izlez prv,a.cena,(select max(datum) from sales_daily) last, m.predlog,m.demand,m.safety,m.f,m.own_f,m.g_f,m.w,m.rate mrate,m.dena,m.do_datum,m.trend30,m.yoy,m.s30,m.s_prev60,m.s90,m.lani90,m.lani_t,m.spike,m.flags from article_stats st join articles a on a.sifra=st.sifra left join order_model m on m.sifra=st.sifra where st.sifra='${s}'`)]);

function groupedRows(list, keyOf, rowOf){ const out=[]; let last=null; list.forEach(r=>{ const k=keyOf(r)||'(без добавувач)'; if(k!==last){ out.push({h:k}); last=k; } out.push(rowOf(r)); }); return out; }

async function makePdf(title, rows, head, filename, msgEl){

async function viewNaracki(){

  const done=r=>+r.n>0 && +r.ima + +r.nema === +r.n;
  const rows=NKALL?allrows:allrows.filter(r=>!done(r)); const nDone=allrows.filter(done).length;
  const byDate={}; rows.forEach(r=>{ (byDate[r.datum] ??= []).push(r); });
  const dates=Object.keys(byDate).sort().reverse();
  const OPEN=window.NKOPEN||(window.NKOPEN={}); if(dates.length&&OPEN[dates[0]]===undefined) OPEN[dates[0]]=true;
  const dmy=d=>d.slice(8)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
  const dayN=d=>['Недела','Понеделник','Вторник','Среда','Четврток','Петок','Сабота'][new Date(d).getDay()];
  main.innerHTML=`<h1>Нарачки</h1><p class="sub">${NKALL?'Сите нарачки':'Активни нарачки (во тек)'} · по датуми · клик на датум = отвори/затвори</p>
    <div class="inline" style="margin-bottom:10px"><button class="tab${!NKALL?' on':''}" id="nk-akt">Активни (${allrows.length-nDone})</button><button class="tab${NKALL?' on':''}" id="nk-site">Сите (${allrows.length})</button></div>
    ${dates.length?dates.map(d=>{ const g=byDate[d]; const na=g.reduce((a,r)=>a+ +r.n,0); const op=!!OPEN[d];
      return `<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden">

async function viewCheck(h){
  const m=h.match(/^oc(\d+)_(.*)$/); const oid=+m[1]; const dob=decodeURIComponent(m[2]);
  main.innerHTML='<div class="empty">Вчитувам…</div>';
  const [[o],items,alld]=await Promise.all([sql(`select * from orders where id=${oid}`),
    sql(`select i.id,i.sifra,i.kolicina,i.status,i.dobavuvac,a.ime,st.zaliha from order_items i join articles a on a.sifra=i.sifra left join article_stats st on st.sifra=i.sifra where i.order_id=${oid} and coalesce(i.dobavuvac,'')='${sq(dob)}' order by a.ime`),
    sql(`select d from (select dobavuvac_sw d from articles where dobavuvac_sw is not null union select ime from suppliers) x group by 1 order by 1`)]);
  let cur=Math.max(0, items.findIndex(i=>i.status==='ceka'));
  const noDob = dob==='';
  main.innerHTML=`<a class="back" href="#o${oid}">← ${esc(o.naziv)}</a><h1 style="margin-top:6px">${dob?esc(dob):'Без добавувач'}</h1>
    <p class="sub">${items.length} артикли · <b>↓ ↑</b> движење · <b>Enter</b> = има (зелено) · <b>Space</b> = нема (црвено) · или кликни ✓ / ✗</p>
    ${noDob?'<datalist id="dobl2">'+alld.map(d=>`<option value="${esc(d.d)}">`).join('')+'</datalist>':''}
    <div class="card" id="chk">${items.map((i,k)=>`<div class="ci ${i.status}" data-id="${i.id}" data-k="${k}" tabindex="0">
        <div style="flex:1;min-width:0"><b>${esc(i.ime)}</b> <span class="code">${i.sifra}</span><div class="hint">залиха ${fmt1(i.zaliha)}</div>${noDob?`<input class="ci-d" list="dobl2" placeholder="добавувач" value="" style="margin-top:4px;width:200px">`:''}</div>
        <div class="bigq">${fmt1(i.kolicina)}</div><div class="inline"><button class="ok" title="Има (Enter)">✓</button><button class="no" title="Нема (Space)">✗</button></div></div>`).join('')}</div>
    <div class="inline" style="margin-top:12px"><button class="btn" id="finish">Заврши — „нема“ одат во „Пробај на друго место“</button><a class="btn sec" href="#o${oid}">Назад</a><span id="cmsg" class="hint"></span></div>`;
  const els=[...main.querySelectorAll('.ci')];
  const focus=k=>{ cur=Math.max(0,Math.min(els.length-1,k)); els.forEach((e,i)=>e.classList.toggle('cur',i===cur)); els[cur].scrollIntoView({block:'center',behavior:'smooth'}); };
  const setStatus=async(k,st)=>{ const e=els[k]; e.classList.remove('ima','nema','ceka'); e.classList.add(st); items[k].status=st;
    try{ await sql(`update order_items set status='${st}' where id=${+e.dataset.id}`); }catch(err){ document.getElementById('cmsg').textContent=err.message; }
    focus(k+1); };
  els.forEach((e,k)=>{ e.querySelector('.ok').onclick=ev=>{ev.stopPropagation(); setStatus(k,'ima');}; e.querySelector('.no').onclick=ev=>{ev.stopPropagation(); setStatus(k,'nema');}; e.onclick=()=>focus(k);
    const di=e.querySelector('.ci-d'); if(di){ let t; di.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>sql(`update order_items set dobavuvac=${di.value.trim()?`'${sq(di.value.trim())}'`:'null'} where id=${+e.dataset.id}`).catch(()=>{}),600); }; di.onkeydown=ev=>ev.stopPropagation(); } });
  const keyh=ev=>{ if(!document.getElementById('chk')) { window.removeEventListener('keydown',keyh); return; }
    if(ev.key==='ArrowDown'){ ev.preventDefault(); focus(cur+1); } else if(ev.key==='ArrowUp'){ ev.preventDefault(); focus(cur-1); }
    else if(ev.key==='Enter'){ ev.preventDefault(); setStatus(cur,'ima'); } else if(ev.key===' '){ ev.preventDefault(); setStatus(cur,'nema'); } };
  window.addEventListener('keydown',keyh);
  if(els.length) focus(cur);
  document.getElementById('finish').onclick=async()=>{ const b=document.getElementById('finish'); b.disabled=true;
    try{ const [r]=await sql(`select order_finish_supplier(${oid}, ${dob?`'${sq(dob)}'`:'null'}) id`); const nema=items.filter(i=>i.status==='nema').length;
      document.getElementById('cmsg').textContent = r.id ? `${nema} артикли се префрлени во „Пробај да најдеш на друго место“.` : 'Нема артикли со „нема“ — сè е нарачано.';
      setTimeout(()=>location.hash= r.id ? 'o'+r.id : 'o'+oid, 1200); }
    catch(e){ document.getElementById('cmsg').textContent=e.message; b.disabled=false; } };
}

const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','ѓ':'gj','е':'e','ж':'zh','з':'z','ѕ':'dz','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ќ':'kj','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','џ':'dz','ш':'sh'};
const translit=w=>[...w.toLowerCase()].map(c=>CYR[c]??c).join('');
const sqlLike=w=>w.replace(/'/g,"''").replace(/[%_\\]/g,m=>'\\'+m);
function rtHtml(){ return `<div class="card">
  <p class="hint" style="margin:0 0 10px">Избери артикли, прегледај ги и преземи табела за контрола на рокови како Excel или PDF. Пополнетиот Excel се враќа подолу со „Качи пополнета табела“.</p>
  <div class="inline" style="flex-wrap:wrap;gap:8px">
    <select id="rtmode"><option value="kw">Клучен збор / дел од име</option><option value="9">Бренд</option><option value="8">Збирен бренд</option><option value="1">Подгрупа</option><option value="list">Листа подготвена од Claude</option></select>
    <input id="rtval" list="rtopts" placeholder="пр. исла" style="min-width:260px"><datalist id="rtopts"></datalist>
    <label class="hint"><input type="checkbox" id="rtz" checked> само со залиха</label>
    <button class="btn" id="rtgo">Прикажи</button><span id="rtmsg" class="hint"></span>
  </div>
  <div id="rtres" style="margin-top:12px"></div>
  <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
  <div class="inline" style="flex-wrap:wrap;gap:8px"><b>Качи пополнета табела</b><input type="file" id="rtfile" accept=".xlsx"><span id="rtup" class="hint"></span></div>
  <div id="rtprev" style="margin-top:10px"></div></div>`; }
let RTTAGS=null, RTLISTS=null;
async function rtOptions(){ const mode=document.getElementById('rtmode').value, inp=document.getElementById('rtval'), dlst=document.getElementById('rtopts');
  inp.value=''; dlst.innerHTML='';
  if(mode==='kw'){ inp.placeholder='пр. исла, brufen sirup, 027733'; return; }
  if(mode==='list'){ inp.placeholder='избери листа';
    try{ RTLISTS=RTLISTS||await sql(`select id,ime,opis,array_length(sifri,1) n,to_char(created_at,'DD.MM.YYYY') d from rok_lists order by created_at desc`); }catch(e){ RTLISTS=[]; }
    dlst.innerHTML=RTLISTS.map(l=>`<option value="${esc(l.ime)}">${l.n} артикли · ${l.d}${l.opis?' · '+esc(l.opis):''}</option>`).join('');
    if(!RTLISTS.length) document.getElementById('rtmsg').textContent='Уште нема листи. Кажи ми во разговор што ти треба (пр. „сите brufen сирупи“) и ќе ја подготвам тука.';
    return; }
  inp.placeholder='почни да пишуваш…';
  RTTAGS=RTTAGS||await sql(`select t.id,t.ime,t.group_id,count(at.sifra) n from tags t left join article_tags at on at.tag_id=t.id where t.group_id in (1,8,9) group by 1,2,3 order by t.ime`);
  dlst.innerHTML=RTTAGS.filter(t=>t.group_id==mode).map(t=>`<option value="${esc(t.ime)}">${t.n} артикли</option>`).join(''); }
async function rtSearch(){ const mode=document.getElementById('rtmode').value, v=document.getElementById('rtval').value.trim(), msg=document.getElementById('rtmsg'), res=document.getElementById('rtres');
  if(!v){ msg.textContent='Внеси вредност.'; return; }
  let cond, title=v;
  if(mode==='kw'){ const words=v.split(/\s+/).filter(Boolean);
    cond=words.map(w=>{ const a=sqlLike(w), b=sqlLike(translit(w)); return `(a.ime ilike '%${a}%' or a.ime ilike '%${b}%' or a.sifra like '${a}%')`; }).join(' and '); }
  else if(mode==='list'){ const l=(RTLISTS||[]).find(x=>x.ime===v); if(!l){ msg.textContent='Избери листа од понудените.'; return; } cond=`a.sifra = any((select sifri from rok_lists where id=${+l.id}))`; }
  else { const t=(RTTAGS||[]).find(x=>x.group_id==mode&&x.ime===v); if(!t){ msg.textContent='Избери од понудените вредности.'; return; }
    cond=`a.sifra in (select at.sifra from article_tags at join tags t on t.id=at.tag_id where t.id=${+t.id} or t.parent_id=${+t.id})`; }
  const z=document.getElementById('rtz').checked?'and coalesce(st.zaliha,0)>0':'';
  msg.textContent='Барам…';
  try{ const [rows,[d]]=await Promise.all([sql(`select a.sifra,a.ime,coalesce(st.zaliha,0) zaliha,(select string_agg(to_char(l.rok,'MM.YYYY')||' – '||l.kolicina::float,', ' order by l.rok) from lots l where l.sifra=a.sifra and l.status='aktivna') serii from articles a left join article_stats st on st.sifra=a.sifra where a.aktiven and ${cond} ${z} order by a.ime limit 3000`),sql(`select to_char(max(datum),'DD.MM.YYYY') d from stock_snapshots`)]);
    RT.rows=rows; RT.title=title; RT.zdat=d.d; msg.textContent='';
    if(!rows.length){ res.innerHTML='<div class="empty">Нема артикли за ова барање.</div>'; return; }
    res.innerHTML=`<div class="inline" style="flex-wrap:wrap;gap:8px;margin-bottom:8px"><b id="rtcnt">${rows.length}</b> артикли · залиха од извештај ${d.d}
      <button class="btn" id="rtxls">⬇ Excel</button><button class="btn sec" id="rtpdf">⬇ PDF</button><span id="rtout" class="hint"></span></div>
      <div class="twrap" style="max-height:460px;overflow:auto"><table><tr><th style="width:28px"><input type="checkbox" id="rtall" checked></th><th>Шифра</th><th>Артикл</th><th class="n">Залиха</th><th>Внесени рокови</th></tr>
      ${rows.map((r,i)=>`<tr><td><input type="checkbox" class="rtc" data-i="${i}" checked></td><td class="code">${r.sifra}</td><td><a class="art" href="#a${r.sifra}">${esc(r.ime)}</a></td><td class="n">${fmt1(r.zaliha)}</td><td class="hint">${esc(r.serii||'')}</td></tr>`).join('')}</table></div>`;
    const cnt=()=>document.getElementById('rtcnt').textContent=rtSel().length;
    document.getElementById('rtall').onchange=e=>{ res.querySelectorAll('.rtc').forEach(c=>c.checked=e.target.checked); cnt(); };
    res.querySelectorAll('.rtc').forEach(c=>c.onchange=cnt);
    document.getElementById('rtxls').onclick=()=>rtExcel(document.getElementById('rtout'));
    document.getElementById('rtpdf').onclick=()=>rtPdf(document.getElementById('rtout'));
  }catch(e){ msg.textContent='Грешка: '+e.message; } }
const rtSel=()=>[...document.querySelectorAll('#rtres .rtc')].filter(c=>c.checked).map(c=>RT.rows[+c.dataset.i]);
const rtFile=ext=>`rokovi_${RT.title.replace(/[^\p{L}\p{N}]+/gu,'_')}_${new Date().toISOString().slice(0,10)}.${ext}`;
async function rtExcel(out){ const rows=rtSel(); if(!rows.length){ out.textContent='Нема штиклирани артикли.'; return; }
  try{ out.textContent='Правам Excel…';
    await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js');
    const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet('Внес',{views:[{state:'frozen',xSplit:2,ySplit:4}],pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:'4:4'}});
    const A={name:'Arial',size:9}, thin={style:'thin',color:{argb:'FFBFBFBF'}}, B={top:thin,left:thin,bottom:thin,right:thin};
    const yel={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF7CC'}}, grey={type:'pattern',pattern:'solid',fgColor:{argb:'FFF2F2F2'}};
    ws.getCell('A1').value=`Merifarm — внес на рокови: ${RT.title}`; ws.getCell('A1').font={name:'Arial',size:14,bold:true};
    ws.getCell('A2').value='Датум на контрола:'; ws.getCell('A2').font={name:'Arial',bold:true};
    Object.assign(ws.getCell('C2'),{fill:yel,border:B,numFmt:'dd.mm.yyyy'});
    ws.getCell('E2').value=`Пополнувај само жолтите колони. Рок: ММ.ГГГГ (пр. 03.2027). Повеќе од 3 рока → нов ред, иста шифра. Залиха од извештај ${RT.zdat}.`; ws.getCell('E2').font={name:'Arial',size:9,italic:true,color:{argb:'FF595959'}};
    const H=['Шифра','Артикл','Залиха','Кол. 1','Рок 1','Кол. 2','Рок 2','Кол. 3','Рок 3','Внесено','Разлика','Забелешка'], W=[9,52,8,8,9,8,9,8,9,9,9,28];
    ws.columns=W.map(w=>({width:w}));
    H.forEach((h,i)=>{ const c=ws.getCell(4,i+1); c.value=h; c.font={name:'Arial',bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1F3864'}}; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border=B; });
    rows.forEach((r,i)=>{ const n=5+i;
      const v=[r.sifra,r.ime,+r.zaliha]; v.forEach((x,k)=>{ const c=ws.getCell(n,k+1); c.value=x; c.font=A; c.border=B; });
      ws.getCell(n,1).numFmt='@'; ws.getCell(n,3).numFmt='#,##0.##';
      for(let k=4;k<=9;k++){ const c=ws.getCell(n,k); Object.assign(c,{fill:yel,border:B,font:A,numFmt:k%2?'@':'#,##0.##',alignment:{horizontal:'center'}}); }
      ws.getCell(n,10).value={formula:`IF(COUNT(D${n},F${n},H${n})=0,"",SUM(D${n},F${n},H${n}))`};
      ws.getCell(n,11).value={formula:`IF(J${n}="","",J${n}-C${n})`};
      [10,11].forEach(k=>Object.assign(ws.getCell(n,k),{font:A,border:B,fill:grey,numFmt:'#,##0.##;-#,##0.##;0'}));
      const z=ws.getCell(n,12); z.border=B; z.font={name:'Arial',size:8,color:{argb:'FF808080'}}; if(r.serii) z.value='веќе внесено: '+r.serii;
      ['E','G','I'].forEach(col=>ws.getCell(col+n).dataValidation={type:'custom',allowBlank:true,formulae:[`OR(${col}${n}="",AND(LEN(${col}${n})=7,MID(${col}${n},3,1)="."))`],showErrorMessage:true,errorTitle:'Рок',error:'Рок во формат ММ.ГГГГ, пр. 03.2027'}); });
    const last=4+rows.length; ws.autoFilter=`A4:L${last}`;
    ws.addConditionalFormatting({ref:`K5:K${last}`,rules:[{type:'expression',formulae:['AND(K5<>"",K5<>0)'],style:{font:{color:{argb:'FFC00000'},bold:true},fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFFCE4E4'}}}}]});
    dl(rtFile('xlsx'), new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    out.textContent=`Excel е подготвен (${rows.length} артикли).`;
  }catch(e){ out.textContent='Грешка: '+(e.message||e); } }
async function rtPdf(out){ const rows=rtSel(); if(!rows.length){ out.textContent='Нема штиклирани артикли.'; return; }
  try{ out.textContent='Правам PDF…';
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'l'}); const PER=26, pgs=Math.ceil(rows.length/PER), today=new Date().toLocaleDateString('mk-MK');
    const td='border:1px solid #000;padding:5px 6px;font:12px Calibri,Arial,sans-serif;vertical-align:middle', th=td+';background:#d9d9d9;font-weight:bold;text-align:center';
    for(let i=0;i<rows.length;i+=PER){ const pg=i/PER+1;
      const div=document.createElement('div'); div.style.cssText='position:fixed;left:-10000px;top:0;width:1123px;background:#fff;color:#000;padding:24px 28px;font:12px Calibri,Arial,sans-serif';
      div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><b style="font-size:16px">Merifarm — внес на рокови: ${esc(RT.title)}</b><span style="font-size:11px">${rows.length} артикли · залиха од ${RT.zdat} · датум на контрола: ____________ · стр. ${pg}/${pgs}</span></div>
      <table style="width:100%;border-collapse:collapse"><tr><th style="${th};width:62px">Шифра</th><th style="${th};text-align:left">Артикл</th><th style="${th};width:56px">Залиха</th>${[1,2,3].map(k=>`<th style="${th};width:58px">Кол. ${k}</th><th style="${th};width:78px">Рок ${k}</th>`).join('')}</tr>
      ${rows.slice(i,i+PER).map(r=>`<tr><td style="${td};font-family:Consolas,monospace">${r.sifra}</td><td style="${td}">${esc(r.ime)}</td><td style="${td};text-align:right;font-weight:bold">${fmt1(r.zaliha)}</td>${'<td style="'+td+'"></td>'.repeat(6)}</tr>`).join('')}</table>
      <div style="font-size:10px;margin-top:6px;color:#444">Рок: ММ.ГГГГ (пр. 03.2027). Збирот на количините треба да е еднаков на залихата.</div>`;
      document.body.appendChild(div); const cv=await html2canvas(div,{scale:2,backgroundColor:'#fff'}); div.remove();
      if(i) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg',0.93),'JPEG',0,0,297,Math.min(cv.height*297/cv.width,210)); }
    dl(rtFile('pdf'), pdf.output('blob')); out.textContent=`PDF е подготвен (${rows.length} артикли, ${pgs} стр.).`;
  }catch(e){ out.textContent='Грешка: '+(e.message||e); } }
function rtRok(v){ if(v==null||v==='') return null;
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}`;
  if(typeof v==='object'&&v.richText) v=v.richText.map(x=>x.text).join(''); if(typeof v==='object'&&v.text) v=v.text; if(typeof v==='object'&&v.result!=null) v=v.result;
  if(typeof v==='number'){ const m=Math.floor(v), y=Math.round((v-m)*10000); return (m>=1&&m<=12&&y>2000)?`${y}-${String(m).padStart(2,'0')}`:null; }
  const r=parseRok(String(v)); return r?r.slice(0,7):null; }
async function rtUpload(f){ const out=document.getElementById('rtup'), prev=document.getElementById('rtprev'); prev.innerHTML=''; if(!f) return;
  try{ out.textContent='Читам…';
    await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js');
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer()); const ws=wb.getWorksheet('Внес')||wb.worksheets[0];
    let dv=ws.getCell('C2').value, datum=new Date().toISOString().slice(0,10);
    if(dv instanceof Date) datum=dv.toISOString().slice(0,10); else if(dv){ const p=parseRok(String(dv)); if(p&&p.length===10) datum=p; }
    const hdr=[]; ws.getRow(4).eachCell((c,k)=>hdr[k]=String(c.value||''));
    const kc=[], rc=[]; hdr.forEach((h,k)=>{ if(/^Кол\./.test(h)) kc.push(k); if(/^Рок/.test(h)) rc.push(k); });
    const lines=[], errs=[], arts=new Set(); let cur=null;
    for(let n=5;n<=ws.rowCount;n++){ const row=ws.getRow(n); let s=row.getCell(1).value; s=s==null?'':String(s.text||s).trim(); if(/^\d+$/.test(s)) s=s.padStart(6,'0'); if(s) cur=s; if(!cur) continue;
      kc.forEach((k,j)=>{ let q=row.getCell(k).value, r=row.getCell(rc[j]).value; if(q&&typeof q==='object') q=q.result; if((q==null||q==='')&&(r==null||r==='')) return;
        const rok=rtRok(r); if(q==null||q===''||isNaN(+q)||!rok){ errs.push(`ред ${n} (${cur}): провери количина/рок`); return; }
        lines.push(`${cur}|${+q}|${rok}|${datum}`); arts.add(cur); }); }
    out.textContent='';
    if(!lines.length&&!errs.length){ prev.innerHTML='<div class="empty">Во табелата нема пополнети рокови.</div>'; return; }
    prev.innerHTML=`<div class="card ${errs.length?'alert':''}"><b>${arts.size}</b> артикли · <b>${lines.length}</b> серии · датум на контрола ${datum.split('-').reverse().join('.')}
      ${errs.length?`<div class="down" style="margin-top:6px">${errs.length} реда не се јасни и нема да се внесат:<br>${errs.slice(0,15).map(esc).join('<br>')}${errs.length>15?'<br>…':''}</div>`:''}
      <div class="hint" style="margin-top:6px">Внесувањето ги заменува досегашните серии кај овие артикли.</div>
      <div class="inline" style="margin-top:8px"><button class="btn" id="rtimp" ${lines.length?'':'disabled'}>Внеси во базата</button><span id="rtimsg"></span></div></div>`;
    document.getElementById('rtimp').onclick=async e=>{ e.target.disabled=true; const m=document.getElementById('rtimsg');
      try{ const [r]=await sql(`select import_lots($rt$${lines.join('\n')}$rt$) n`); toast(m,`Внесени ${r.n} серии кај ${arts.size} артикли.`); RTLISTS=null; setTimeout(()=>{ PTAB='rokovi'; route(); },1800); }
      catch(err){ toast(m,err.message,true); e.target.disabled=false; } };
  }catch(e){ out.textContent='Грешка: '+(e.message||e); } }
function wireRokTabela(){ const mode=document.getElementById('rtmode'); if(!mode) return;
  mode.onchange=rtOptions; rtOptions();
  document.getElementById('rtgo').onclick=rtSearch;
  document.getElementById('rtval').onkeydown=e=>{ if(e.key==='Enter') rtSearch(); };
  document.getElementById('rtfile').onchange=e=>rtUpload(e.target.files[0]); }
function parseRok(v){ v=(v||'').trim(); let m=v.match(/^(\d{1,2})[.\/-](\d{4})$/); if(m) return `${m[2]}-${m[1].padStart(2,'0')}`; m=v.match(/^(\d{4})-(\d{2})$/); if(m) return v; m=v.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; return null; }
function alertInline(el,msg){ let s=el.querySelector('.msg'); if(!s){ s=document.createElement('span'); s.className='msg'; el.appendChild(s);} toast(s,msg,true); }
function lotsSection(sifra, lots, pend, state){
  return `<div class="card">
    ${state?`<div class="hint" style="margin-bottom:8px">Продажбата е распоредена до ${esc(state.applied_through)}.</div>`:'<div class="hint" style="margin-bottom:8px">Овој артикл уште не се следи по рокови. Внеси ја првата контрола подолу.</div>'}
    <div class="twrap"><table><tr><th>Рок</th><th class="n">Останато</th><th class="n">Почетно</th><th class="n">Продадено</th><th class="n">Дена до рок</th><th>Извор</th></tr>
    ${lots.length?lots.map(l=>`<tr${+l.dena_do_rok<=90?' style="color:var(--bad)"':''}><td>${rokFmt(l.rok)}</td><td class="n"><b>${fmt1(l.kolicina)}</b></td><td class="n">${fmt1(l.pocetna)}</td><td class="n">${fmt1(l.potroseno)}</td><td class="n">${fmt(l.dena_do_rok)}</td><td class="hint">${l.izvor==='priem'?'приемен лист':'контрола'} ${esc(l.datum_priem||'')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Нема активни серии</td></tr>'}
    ${lots.length?`<tr><td><b>Вкупно</b></td><td class="n"><b>${fmt1(lots.reduce((s,l)=>s+ +l.kolicina,0))}</b></td><td colspan="4"></td></tr>`:''}</table></div>
    ${pend.length?`<h2 style="margin-top:14px">На чекање за рок</h2><div class="twrap"><table>${pend.map(p=>`<tr id="pd${p.id}"><td>${esc(p.datum||'')}</td><td class="n">${fmt1(p.kolicina)}</td><td><input class="rok" placeholder="ММ.ГГГГ" style="width:110px"></td><td><button class="btn" data-pend="${p.id}">Запиши</button></td></tr>`).join('')}</table></div>`:''}
    <h2 style="margin-top:14px">Контрола на рокови (замена на сите серии)</h2>
    <div id="lotrows"></div>
    <div class="inline" style="margin-top:8px"><button class="btn sec" id="lotadd">+ ред</button><span class="hint">Датум на контрола</span><input type="date" id="lotdate" value="${new Date().toISOString().slice(0,10)}"><button class="btn" id="lotsave">Зачувај контрола</button><span id="lotmsg"></span></div>
  </div>`;
}
function wireLots(sifra, reload){
  const rows=document.getElementById('lotrows');
  const addRow=()=>{ const d=document.createElement('div'); d.className='inline'; d.style.marginTop='6px'; d.innerHTML=`<input type="number" min="0" step="0.5" placeholder="количина" style="width:120px" class="lk"><input placeholder="рок ММ.ГГГГ" style="width:130px" class="lr"><button class="btn sec rm">×</button>`; d.querySelector('.rm').onclick=()=>d.remove(); rows.appendChild(d); };
  addRow(); addRow();
  document.getElementById('lotadd').onclick=addRow;
  document.getElementById('lotsave').onclick=async()=>{ const msg=document.getElementById('lotmsg'); const parts=[];
    for(const d of rows.querySelectorAll('.inline')){ const k=d.querySelector('.lk').value, r=parseRok(d.querySelector('.lr').value); if(k===''&&!d.querySelector('.lr').value) continue; if(k===''||!r){ toast(msg,'Провери количина и рок (ММ.ГГГГ)',true); return; } parts.push(`${+k}|${r}`); }
    if(!parts.length){ toast(msg,'Внеси барем една серија',true); return; }
    const b=document.getElementById('lotsave'); b.disabled=true;
    try{ await sql(`select lots_set('${sifra}','${document.getElementById('lotdate').value}','${parts.join(';')}')`); reload(); }catch(e){ toast(msg,e.message,true); b.disabled=false; } };

function subBrandCharts(rows, years, Y){

        ${groupChart(MES,series,130)}</div>`; }).join('')}</div>`;

    <a class="back" href="#artikli">← Артикли</a>
    <h1 style="margin-top:6px">${esc(a.ime)}</h1>
    <p class="sub"><span class="code">${a.sifra}</span>${a.aktiven?'':' <span class="chip bad">неактивен</span>'}</p>
    <div class="tiles">
      <div class="tile${+a.zaliha<0?' bad':''}"><div class="l">Залиха (${esc(a.zaliha_datum||'—')})</div><div class="v">${fmt1(a.zaliha)}<small>${esc(a.em||'')}</small></div></div>
      <div class="tile"><div class="l">Продажна цена</div><div class="v">${fmt2(a.cena)}<small>ден.</small></div></div>
      <div class="tile"><div class="l">Продадено 30 дена</div><div class="v">${fmt(cmp.t30)}</div><div class="hint">лани: ${fmt(cmp.l30)} · ${pct(+cmp.t30,+cmp.l30)}</div></div>
      <div class="tile"><div class="l">Продадено 90 дена</div><div class="v">${fmt(cmp.t90)}</div><div class="hint">лани: ${fmt(cmp.l90)} · ${pct(+cmp.t90,+cmp.l90)}</div></div>
      <div class="tile${pokrie!=null&&pokrie<14?' bad':''}"><div class="l">Залихата трае уште</div><div class="v">${pokrie==null?'—':fmt(pokrie)}<small>дена</small></div></div>
      <div class="tile"><div class="l">Последна набавна (без / со ДДВ)</div><div class="v">${last?fmt2(last.nab_cena):'—'}<small>${last?'/ '+fmt2(last.so_ddv):''}</small></div><div class="hint">${last?esc(last.datum)+' · '+esc(last.dobavuvac||''):'нема увезени влезови'}</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div><h2>Тагови</h2><div class="card"><div id="mytags">${renderTags()}</div><div style="margin-top:10px">${tagPicker('artpick')}</div></div></div>
      <div><h2>Забелешка</h2><div class="card"><textarea id="nota" placeholder="Слободен текст: договори, состојба, што да се внимава…">${esc(a.zabeleska||'')}</textarea>
        <div class="inline" style="margin-top:8px"><button class="btn" id="savenota">Зачувај</button><span class="hint" id="notadate">${a.zabeleska_datum?'последна промена '+a.zabeleska_datum.slice(0,16).replace('T',' '):''}</span><span id="notamsg"></span></div></div></div>
    </div>
    <h2>Препорачана залиха (по просек од 90 дена: ${fmt1(dnevno)}/ден)</h2>
    <div class="card"><div class="cover">${per.map(([l,d])=>{const need=Math.ceil(dnevno*d); const ok=(+a.zaliha||0)>=need; return `<div class="${ok?'ok':'low'}"><div class="l">${l}</div><div class="v">${fmt(need)}</div></div>`;}).join('')}</div>
      <p class="hint" style="margin-top:10px">Зелено: моменталната залиха го покрива периодот. Црвено: недостига.</p></div>
    <h2>Продажба по месец, по години (парчиња)</h2><div class="card">${Y.chart}<div class="twrap" style="margin-top:10px">${Y.table}</div></div>
    <h2>Рокови (серии)</h2>${lotsSection(sifra,lots,pendA,lstate)}
    ${rshRows.length?`<h2>Расход (не е продажба)</h2><div class="card twrap rh"><table><tr><th>Датум</th><th>Документ</th><th class="n">Кол.</th><th class="n">Вредност</th></tr>${rshRows.map(r=>`<tr class="rh"><td>${esc(r.datum)}</td><td>${esc(r.dokument)}</td><td class="n">${fmt1(r.kolicina)}</td><td class="n">${fmt2(r.vrednost)}</td></tr>`).join('')}</table><p class="hint" style="margin:8px 0 0">Овие количини се одземени од продажбата за тој ден.</p></div>`:''}
    <h2>Влезови (набавки)</h2><div class="card twrap"><table><tr><th>Датум</th><th>Добавувач</th><th>Приемен лист / фактура</th><th class="n">Кол.</th><th class="n">Наб. без ДДВ</th><th class="n">Наб. со ДДВ</th><th class="n">Прод. цена</th></tr>
      ${nab.length?nab.map(r=>`<tr><td>${esc(r.datum)}</td><td>${r.sid?`<a class="art" href="#d${r.sid}">${esc(r.dobavuvac)}</a>`:'—'}</td><td><span class="code">${esc(r.broj)}${r.br_faktura?' · ф. '+esc(r.br_faktura):''}</span></td><td class="n">${fmt1(r.kol)}</td><td class="n">${fmt2(r.nab_cena)}</td><td class="n">${fmt2(r.so_ddv)}</td><td class="n">${fmt2(r.prod_cena)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Нема увезени влезови за овој артикл</td></tr>'}</table></div>
    <div class="row">
      <div><h2>Продажба по ден, последни 90 дена</h2><div class="card">${barChart(dni,d=>d.datum.slice(8)+'.'+d.datum.slice(5,7),d=>+d.kol)}</div></div>
      <div><h2>Податоци</h2><div class="card"><div class="kv">
          <b>ДДВ</b><span>${fmt(a.ddv)} %</span><b>Тарифа</b><span>${esc(a.tar||'—')}</span><b>Маржа</b><span>${a.marza!=null?fmt1(a.marza)+' %':'—'}</span>
          <b>Ед. мера</b><span>${esc(a.em||'—')}</span><b>Последна продажба</b><span>${esc(a.posledna_prodazba||'—')}</span><b>Продадено 12 мес.</b><span>${fmt(a.prod_365)}</span>
        </div></div>
        <h2>Историја на залиха</h2><div class="card twrap"><table><tr><th>Датум</th><th class="n">Залиха</th></tr>${hist.map(h=>`<tr><td>${h.datum}</td><td class="n">${fmt1(h.kolicina)}</td></tr>`).join('')}</table></div></div>
    </div>`;
  wireLots(sifra, ()=>viewArtikal(sifra));
  const tagsEl=document.getElementById('mytags');
  const wireDel=()=>tagsEl.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ b.disabled=true;
    try{ await sql(`delete from article_tags where sifra='${sifra}' and tag_id=${+b.dataset.del}`); const i=mytags.findIndex(t=>String(t.id)===b.dataset.del); if(i>=0) mytags.splice(i,1); tagsEl.innerHTML=renderTags(); wireDel(); }
    catch(e){ toast(document.querySelector('#artpick .msg'),e.message||e,true); b.disabled=false; } });
  wireDel();
  wirePicker(document.getElementById('artpick'), async(gid,gname,name)=>{
    const tid=await ensureTag(gid,gname,name);
    await sql(`insert into article_tags(sifra,tag_id) values ('${sifra}',${+tid}) on conflict do nothing`);
    await loadTags(true); const t=TAGS.find(t=>String(t.id)===String(tid)); if(t&&!mytags.find(x=>String(x.id)===String(tid))) mytags.push({id:t.id,ime:t.ime,grupa:t.grupa});
    tagsEl.innerHTML=renderTags(); wireDel(); toast(document.querySelector('#artpick .msg'),'Додадено');
  });
  document.getElementById('savenota').onclick=async()=>{ const b=document.getElementById('savenota'); b.disabled=true;
    try{ const v=document.getElementById('nota').value.trim(); await sql(`update articles set zabeleska=${v?`'${sq(v)}'`:'null'}, zabeleska_datum=${v?'now()':'null'} where sifra='${sifra}'`);
      document.getElementById('notadate').textContent=v?'последна промена сега':''; toast(document.getElementById('notamsg'),'Зачувано'); }
    catch(e){ toast(document.getElementById('notamsg'),e.message||e,true); } b.disabled=false; };
}

/* ---------- најави (безбедност) ---------- */
async function viewNajavi(){
  main.innerHTML='<div class="empty">Вчитувам…</div>';
  const [rows,users]=await Promise.all([sql(`select email, to_char(at at time zone 'Europe/Skopje','DD.MM.YYYY HH24:MI') koga, user_agent ua, ip from app_logins order by at desc limit 50`), sql(`select email, ime from app_users order by email`)]);
  const dev=ua=>{ ua=ua||''; const os=/iPhone|iPad/.test(ua)?'iPhone/iPad':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'Mac':'?'; const br=/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':/Firefox\//.test(ua)?'Firefox':'?'; return os+' · '+br; };
  main.innerHTML=`<h1>Најави и безбедност</h1>
    <div class="tiles"><div class="tile"><div class="l">Дозволени корисници</div><div class="v" style="font-size:16px">${users.map(u=>esc(u.email)).join('<br>')}</div><div class="hint">Само овие е-пошти можат да направат налог и да гледаат податоци.</div></div>
      <div class="tile"><div class="l">Најави (последни 50)</div><div class="v">${rows.length}</div></div></div>
    <div class="inline" style="margin:12px 0"><button class="btn sec" id="outall">Одјави ме од сите уреди</button><span class="hint">Ако мислиш дека некој друг ја отворил страната на твој уред, кликни тука и смени лозинка.</span></div>
    <div class="card twrap"><table><tr><th>Кога</th><th>Кој</th><th>Уред</th><th>IP</th></tr>
      ${rows.length?rows.map(r=>`<tr><td>${esc(r.koga)}</td><td>${esc(r.email)}</td><td>${esc(dev(r.ua))}<div class="code">${esc((r.ua||'').slice(0,80))}</div></td><td class="code">${esc(r.ip||'')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Уште нема запишани најави</td></tr>'}</table></div>
    <p class="hint">Секоја успешна најава се запишува. Ако видиш најава што не е твоја (непознат уред, време кога не си работел), одјави се од сите уреди и смени ја лозинката.</p>`;
  document.getElementById('outall').onclick=async()=>{ await sb.auth.signOut({scope:'global'}); showLogin('Одјавен си од сите уреди.'); };
}
/* ---------- router ---------- */
function route(){
  const h=(location.hash||'#pregled').slice(1);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.id==='n-'+h));
  if(!mcp) return;
  const run = /^a\d/.test(h) ? viewArtikal(h.slice(1)) : /^r\d+$/.test(h) ? viewPriem(h.slice(1)) : /^d\d+$/.test(h) ? viewDobavuvac(h.slice(1)) : h==='artikli' ? viewArtikli(q.value) : h==='tagovi' ? viewTagovi() : h==='rashod' ? viewRashod() : h==='vlezovi' ? viewVlezovi() : h==='naracki' ? viewNaracki() : /^o\d+$/.test(h) ? viewNaracka(h.slice(1)) : /^oc\d+_/.test(h) ? viewCheck(h) : h==='rokovi' ? viewProverki() : h==='brendovi' ? viewBrendovi() : h==='najavi' ? viewNajavi() : viewPregled();
  run.catch(fail);
}
let t; q.addEventListener('input',()=>{ if(window.AF) window.AF.page=0; clearTimeout(t); t=setTimeout(()=>{ if(location.hash!=='#artikli') location.hash='artikli'; else route(); },350);});
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ clearTimeout(t); location.hash==='#artikli'?route():location.hash='artikli'; }});
window.addEventListener('hashchange',route);
function dl(filename,data){ const u=URL.createObjectURL(data); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); }
/* ---------- најава ---------- */
const sb=supabase.createClient(SB_URL,SB_KEY);
const login=document.getElementById('login'), lmsg=document.getElementById('lmsg');
function showLogin(msg){ mcp=null; login.hidden=false; document.body.classList.add('auth'); main.innerHTML=''; if(msg) lmsg.innerHTML=`<span class="down">${esc(msg)}</span>`; }
function showApp(user,fresh){ mcp=true; login.hidden=true; document.body.classList.remove('auth'); document.getElementById('who').textContent=user.email;
  if(fresh) sb.rpc('app_login_log',{p_ua:navigator.userAgent}).catch(()=>{});
  route(); }
document.getElementById('lform').onsubmit=async e=>{ e.preventDefault(); const email=document.getElementById('lemail').value.trim(), pass=document.getElementById('lpass').value; lmsg.textContent='Се најавувам…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ lmsg.innerHTML=`<span class="down">${esc(error.message==='Invalid login credentials'?'Погрешна е-пошта или лозинка':error.message)}</span>`; return; }
  showApp(data.user,true); };
document.getElementById('lreg').onclick=async()=>{ const email=document.getElementById('lemail').value.trim(), pass=document.getElementById('lpass').value; if(!email||pass.length<6){ lmsg.innerHTML='<span class="down">Внеси е-пошта и лозинка (најмалку 6 знаци)</span>'; return; } lmsg.textContent='Правам налог…';
  const {data,error}=await sb.auth.signUp({email,password:pass});
  if(error){ lmsg.innerHTML=`<span class="down">${esc(error.message)}</span>`; return; }
  if(data.session) showApp(data.user,true); else lmsg.innerHTML='<span class="up">Налогот е направен. Провери ја е-поштата и кликни на линкот за потврда, па најави се.</span>'; };
document.getElementById('logout').onclick=async()=>{ await sb.auth.signOut(); showLogin(); };
(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session) showApp(data.session.user); else showLogin();
  sb.auth.onAuthStateChange((ev,s)=>{ if(ev==='SIGNED_OUT') showLogin(); });
})();
</script>
</body>
</html>
